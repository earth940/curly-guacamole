name: Build PS2 ELF
on: [push, workflow_dispatch]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: |
          python3 -m zipfile -e chickengun-ps2-menu.zip .
          cp tests_Makefile chicken-ps2/tests/Makefile
      - run: make -C chicken-ps2/tests

  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: apk add --no-cache make python3 py3-pillow || (apt-get update && apt-get install -y make python3 python3-pil)
      - name: Unpack sources
        run: python3 -m zipfile -e chickengun-ps2-menu.zip .
      - name: Build
        run: make -C chicken-ps2
      - uses: actions/upload-artifact@v4
        with:
          name: chickengun-elf
          path: chicken-ps2/chickengun.elf
