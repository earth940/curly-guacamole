name: Build PS2 ELF
on: [push, workflow_dispatch]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find tests dir
        run: |
          find . -name test_menu.c > /tmp/tt.txt
          read -r T < /tmp/tt.txt
          echo "TEST_DIR=${T%/*}" >> "$GITHUB_ENV"
      - run: make -C "$TEST_DIR"

  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: apk add --no-cache make python3 py3-pillow || (apt-get update && apt-get install -y make python3 python3-pil)
      - name: Find project dir
        run: |
          find . -maxdepth 2 -name Makefile -not -path '*/tests/*' > /tmp/mk.txt
          read -r M < /tmp/mk.txt
          echo "APP_DIR=${M%/*}" >> "$GITHUB_ENV"
      - name: Build
        run: make -C "$APP_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: chickengun-elf
          path: |
            chickengun.elf
            **/chickengun.elf
