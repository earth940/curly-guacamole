name: Build PS2 ELF
on: [push, workflow_dispatch]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project dir
        run: |
          D=$(dirname "$(find . -path ./.git -prune -o -name test_menu.c -print | head -n1)")/..
          echo "APP_DIR=$(realpath "$D")" >> "$GITHUB_ENV"
      - run: make -C "$APP_DIR/tests"

  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: apk add --no-cache make python3 py3-pillow || (apt-get update && apt-get install -y make python3 python3-pil)
      - name: Find project dir
        run: |
          M=$(find . -maxdepth 2 -name Makefile -not -path './tests/*' -not -path '*/tests/*' | head
